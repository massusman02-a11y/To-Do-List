<!DOCTYPE html>
<html>
    <head>
        <title>To-Do List</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f9;
                margin-top: 50px;
            }
            .todo-card {
                background-color: #ffffff;
                width: 380px;
                padding: 25px;
                border-radius: 12px;
                box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            }
            h2 {
                color: #333333;
                margin-top: 0;
            }
            input[type="text"] {
                width: 70%;
                padding: 10px;
                border: 1px solid #cccccc;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
            }
            input[type="text"]:focus {
                border-color: #007bff;
            }
            .add-btn {
                padding: 10px 15px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
            }
            .add-btn:hover {
                background-color: #0056b3;
            }
            table {
                width: 100%;
                margin-top: 20px;
                border-collapse: collapse;
            }
            td {
                padding: 10px;
                border-bottom: 1px solid #eeeeee;
                text-align: left;
            }
            td:first-child {
                cursor: pointer;
                font-size: 15px;
                color: #333333;
            }
            .delete-btn {
                background-color: #ff4d4d;
                color: white;
                border: none;
                padding: 6px 12px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 12px;
            }
            .delete-btn:hover {
                background-color: #cc0000;
            }
        </style>
    </head>
    <body>
    <center>
        <div class="todo-card">
            <h2>My To-Do List</h2>
            <input id="T" type="text" placeholder="Enter a new task...">
            <button class="add-btn" onclick="AddTask()">Add</button>
            <table>
                <tbody id="taskdata">
                </tbody>
            </table>
        </div>
    </center>
    </body>
    <script>
        function AddTask() {
            var T = document.getElementById("T").value;
            if (T != "") {
                var table = document.getElementById("taskdata");
                table.innerHTML += "<tr><td onclick='CompleteTask(this)'>" + T + "</td><td style='text-align: right;'><button class='delete-btn' onclick='DeleteTask(this)'>Delete</button></td></tr>";
                document.getElementById("T").value = "";
                SaveData();
            } else {
                alert("Please Enter Task");
            }  
        }

        function CompleteTask(task) {
            if (task.style.textDecoration == "line-through") {
                task.style.textDecoration = "none";
                task.style.color = "#333333";
            } else {
                task.style.textDecoration = "line-through";
                task.style.color = "#888888";
            }
            SaveData();
        }

        function DeleteTask(button) {
            var row = button.parentElement.parentElement;
            row.remove();
            SaveData();
        }

        function SaveData() {
            var table = document.getElementById("taskdata");
            localStorage.setItem("myTasks", table.innerHTML);
        }

        function ShowData() {
            var table = document.getElementById("taskdata");
            var saved = localStorage.getItem("myTasks");
            if (saved != null) {
                table.innerHTML = saved;
            }
        }

        ShowData();
    </script>
</html>
